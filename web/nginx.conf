server {
  listen 80;
  root /usr/share/nginx/html;

  # API отдаётся с того же origin, что и статика: фронт собран без VITE_API_URL
  # и ходит относительными путями, поэтому CORS не нужен, а смена IP машины
  # не требует пересборки образа.
  location /api/ {
    resolver 127.0.0.11 valid=10s; # DNS docker-сети: адрес резолвится лениво,
    set $api http://api:3000;      # иначе nginx падает, если api ещё не поднялся
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
